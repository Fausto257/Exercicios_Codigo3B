<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pessoas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>Cadastro de Pessoas</h1>

            <p>
                Sistema de cadastro utilizando
                Node.js, API REST e MariaDB
            </p>

        </header>


        <!-- =================================
             FORMULÁRIO
        ================================== -->

        <section class="formulario">

            <h2>Inserir Pessoa</h2>

            <form id="formCadastro">

                <div class="campo">

                    <label for="nome">
                        Nome:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="idade">
                        Idade:
                    </label>

                    <input
                        type="number"
                        id="idade"
                        min="18"
                        max="24"
                        placeholder="18 a 24"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="text"
                        id="telefone"
                        placeholder="Digite o telefone"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cidade">
                        Cidade:
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Digite a cidade"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-cadastrar">

                    Cadastrar

                </button>

            </form>

        </section>


        <!-- =================================
             PESQUISA
        ================================== -->

        <section class="pesquisa">

            <h2>Pesquisar Pessoa</h2>

            <div class="pesquisa-area">

                <input
                    type="text"
                    id="campoPesquisa"
                    placeholder="Digite parte do nome"
                >

                <button
                    id="btnPesquisar"
                    class="btn btn-pesquisar">

                    Pesquisar

                </button>


                <button
                    id="btnListar"
                    class="btn btn-listar">

                    Listar Todos

                </button>

            </div>

        </section>


        <!-- =================================
             MENSAGENS
        ================================== -->

        <div id="mensagem"></div>


        <!-- =================================
             TABELA
        ================================== -->

        <section class="resultado">

            <h2>Lista de Pessoas</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                        <th>Ação</th>

                    </tr>

                </thead>


                <tbody id="tabelaPessoas">

                    <tr>

                        <td
                            colspan="6"
                            class="centralizado">

                            Carregando...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
